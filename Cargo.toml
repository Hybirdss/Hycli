[package]
name = "hycli"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
aes-gcm = "0.10.3"
axum = "0.8.9"
base64 = "0.22.1"
chromiumoxide = "0.9.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
graphql-parser = "0.4.1"
httpdate = "1.0.3"
keyring = "4.2.0"
mime_guess = "2.0.5"
rand = "0.10.3"
regex = "1.13.1"
rookie-cookies = { version = "=0.6.0", default-features = false }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled-full"] }
rust-embed = "8.13.0"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tabwriter = "1.4.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }
zip = { version = "8.6.0", features = ["deflate"], default-features = false }
rusty-leveldb = "4.0.1"
snap = "1.1.1"
sysinfo = "0.39.6"
directories = "6.0.0"
which = "8.0.6"

[profile.release]
debug = 0
strip = "symbols"
