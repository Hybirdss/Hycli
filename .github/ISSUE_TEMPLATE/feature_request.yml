name: Suggest an improvement
description: Describe a task that Hycli could make easier.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Start with the task you are trying to finish. Remove credentials, cookies, account details and private website data from anything you attach.
        For open-ended questions, you can also [open a general issue](https://github.com/Hybirdss/Hycli/issues/new).
  - type: input
    id: version
    attributes:
      label: Hycli version
      description: The output of `hycli version`, when the request depends on the current release.
      placeholder: "0.1.1"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      placeholder: "Ubuntu 24.04 · x64"
    validations:
      required: false
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Start with the task and the obstacle you encounter today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful result look like?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples or supporting documentation
      description: Add relevant public documentation, examples or sketches if available.
