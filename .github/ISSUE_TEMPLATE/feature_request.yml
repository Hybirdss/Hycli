name: Suggest an improvement
description: Describe a task that Hycli could make easier.
title: "[Feature] "
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Start with the task and the obstacle you encounter today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful result look like?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples or supporting documentation
      description: Add relevant public documentation, examples or sketches if available.
