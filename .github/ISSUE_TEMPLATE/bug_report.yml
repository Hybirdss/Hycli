name: Report a problem
description: Help reproduce a CLI, MCP, dashboard or preparation problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Describe a reproducible problem. Remove credentials, cookies, account details and private website data from any attachments.
        `hycli feedback` opens a separate, generic issue editor with version and platform details in its title and body. This form asks for those details below.
        For setup questions or ideas, you can also [open a general issue](https://github.com/Hybirdss/Hycli/issues/new).
  - type: input
    id: version
    attributes:
      label: Hycli version
      description: The output of `hycli version`.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      placeholder: "Ubuntu 24.04 · x64"
    validations:
      required: true
  - type: input
    id: install_path
    attributes:
      label: Installation path or package
      description: The executable path, or the archive/package you installed from.
      placeholder: "~/Hycli/hycli from the linux-x64 release archive"
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Dashboard
        - CLI
        - MCP
        - Website preparation
        - Account or browser connection
        - Build or package
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal command or a safe example website when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Add a short error message or screenshot with sensitive details removed.
    validations:
      required: true
