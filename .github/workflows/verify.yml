name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            browser_tests: true
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            platform: darwin-x64
            target: x86_64-apple-darwin
          - os: macos-14
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - os: windows-2022
            platform: win32-x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform: win32-arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Linux native tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config git
      - name: macOS native tools
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config
      - name: Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake -y --no-progress
          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Frontend
        run: |
          npm --prefix dashboard ci
          npm --prefix dashboard run check
          npm --prefix dashboard run build
      - name: Rust checks
        run: |
          cargo fmt --all --check
          cargo test --all-targets --locked
          cargo build --locked --bin hycli --example dashboard_fixture
      - name: Browser dependencies
        if: matrix.browser_tests
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: End-to-end service
        if: matrix.browser_tests
        run: node scripts/test-e2e.mjs --full
      - name: Embedded release
        run: node scripts/build.mjs --skip-dependencies
      - name: Package public files
        run: node scripts/package.mjs
      - name: Extracted package smoke check
        shell: bash
        run: node scripts/smoke-package.mjs dist/artifacts/hycli-*-${{ matrix.platform }}.tar.gz
      - name: Public source snapshot
        if: matrix.browser_tests
        run: node scripts/package.mjs --source
      - uses: actions/upload-artifact@v7
        with:
          name: hycli-${{ matrix.platform }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 30
